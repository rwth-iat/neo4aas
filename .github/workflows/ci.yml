name: CI

on:
  push:
    branches: [master, aas-demonstrator]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Unit tests
        run: uv run pytest -m "not integration"

  # The dependency split is only real if it is checked in a clean environment:
  # installing the base distribution alone must not pull basyx in, and
  # `import neo4aas` must still work. A re-export added to __init__.py would
  # break this without breaking any other job.
  core-without-basyx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install base distribution only
        run: uv venv && uv pip install .
      - name: basyx must be absent
        run: |
          uv run python -c "
          import importlib.util, sys
          assert importlib.util.find_spec('basyx') is None, 'basyx leaked into the base install'
          import neo4aas
          print('import neo4aas OK without basyx:', neo4aas.__version__)
          "

  integration:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/12345678
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -O /dev/null -q http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Integration tests
        # NEO4J_URI set => conftest uses this service instead of starting a
        # testcontainer. The fixtures wipe the database, so it must be throwaway.
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: "12345678"
        run: uv run pytest -m integration
