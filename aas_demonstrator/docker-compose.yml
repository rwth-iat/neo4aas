name: aas-demonstrator

# Per-service ports (no reverse proxy). Browser-reachable URLs:
#   Neo4j browser   http://localhost:7474
#   Repository API  http://localhost:8081/api/v3.1
#   Registry  API   http://localhost:8082/api/v3.1
#   Discovery API   http://localhost:8083/api/v3.1
#   AAS Web UI      http://localhost:3000
#   Chatbot         http://localhost:8091
#
# Requires a .env file next to this compose with: KICONNECT_API_KEY=<key>

services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/12345678
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  repository:
    build:
      # context = repo root so the image installs aas4graph from the local checkout
      context: ..
      dockerfile: aas_demonstrator/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "12345678"
      API_BASE_PATH: /api/v3.1/
      INPUT: /input
    volumes:
      - ../archive/AAS:/input:ro
    healthcheck:
      # Use the cheap /description endpoint, NOT /shells: listing shells iterates the whole
      # object store (and with ECLASS ConceptDescriptions loaded that materializes 100k+
      # objects, OOM-killing the worker on every poll).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; urllib.request.urlopen('http://localhost:80/api/v3.1/description'); \" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Live-value simulator: random-walks the OperationalData Property values in Neo4j
  # every UPDATE_INTERVAL seconds so the demo looks like a running plant. Direct Cypher
  # writes; the Repository/chatbot read live from Neo4j so updates show up immediately.
  operational-simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "12345678"
      UPDATE_INTERVAL: "2"
    restart: unless-stopped

  registry:
    build:
      context: https://github.com/eclipse-basyx/basyx-python-sdk.git#develop
      dockerfile: server/docker/registry/Dockerfile
    ports:
      - "8082:80"
    environment:
      API_BASE_PATH: /api/v3.1/
      STORAGE_PERSISTENCY: "True"
    volumes:
      - ./data/registry/input:/input
      - ./data/registry/storage:/storage

  discovery:
    build:
      context: https://github.com/eclipse-basyx/basyx-python-sdk.git#develop
      dockerfile: server/docker/discovery/Dockerfile
    ports:
      - "8083:80"
    environment:
      API_BASE_PATH: /api/v3.1/
      storage_path: /storage/discovery_store.json
    volumes:
      - ./data/discovery/storage:/storage

  # Chatbot: LangGraph agent, native tool-calling, streaming Claude-Code-style UI (port 8091).
  chatbot-v2:
    build:
      context: ..
      dockerfile: src/neo4aas/chatbot/Dockerfile
    ports:
      - "8091:8091"
    environment:
      KICONNECT_API_KEY: ${KICONNECT_API_KEY}
      # Pumpwerk = this demonstrator stack (internal docker network names).
      REPOSITORY_URL: http://repository/api/v3.1
      # Browser-facing URL for AAS-viewer deep links (the browser can't reach the internal name).
      PUBLIC_REPOSITORY_URL: http://localhost:8081/api/v3.1
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "12345678"
      # Lieferanten = the separate aas_lieferanten stack, reached via its published host ports
      # (host.docker.internal → the Docker host). Requires that stack to be running.
      LIEFERANTEN_REPOSITORY_URL: http://host.docker.internal:8084/api/v3.1
      LIEFERANTEN_PUBLIC_REPOSITORY_URL: http://localhost:8084/api/v3.1
      LIEFERANTEN_NEO4J_URI: bolt://host.docker.internal:7689
      LIEFERANTEN_NEO4J_USER: neo4j
      LIEFERANTEN_NEO4J_PASSWORD: "12345678"
    extra_hosts:
      # Make host.docker.internal resolve on Linux too (works out of the box on Docker Desktop).
      - "host.docker.internal:host-gateway"
    depends_on:
      repository:
        condition: service_healthy

  aas-web-ui:
    image: eclipsebasyx/aas-gui:SNAPSHOT-f1e329e
    container_name: aas-web-ui
    ports:
      - "3000:3000"
    volumes:
      # Endpoints come from this file (URLs are browser-reachable localhost:808x ports)
      - ./basyx-infra.yml:/basyx-infra.yml:ro
    environment:
      ENDPOINT_CONFIG_AVAILABLE: "false"
      PRIMARY_LIGHT_COLOR: "#00549F"
      PRIMARY_DARK_COLOR: "#ff6600"
      ALLOW_EDITING: "true"
      ALLOW_UPLOADING: "true"
    depends_on:
      - repository
      - registry
      - discovery
    restart: unless-stopped


volumes:
  neo4j_data:
  neo4j_logs:
