name: aas-lieferanten

# Supplier ("Lieferanten") AAS Repository — Neo4j-backed, separate from the demonstrator
# stack so both can run side by side. Loads real supplier AAS from
# data/real_aas/real_aas_combined, capped at MAX_PER_DIR per manufacturer
# subdirectory. chatbot_v2 is wired to it later.
#
# Browser-reachable URLs (ports shifted +1/+3 from the demonstrator to avoid clashes):
#   Neo4j browser   http://localhost:7476   (bolt 7689)
#   Repository API  http://localhost:8084/api/v3.1

services:
  neo4j:
    image: neo4j:5
    ports:
      - "7476:7474"
      - "7689:7687"
    environment:
      NEO4J_AUTH: neo4j/12345678
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      # Kept modest: the Docker Desktop VM (~7.8G) also hosts the demonstrator's neo4j, so a
      # larger heap here gets the container OOM-killed (Exited 137) by the VM. 2G holds the
      # ~8966-AAS dataset; give the VM more RAM (or stop the other stack) for extra headroom.
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  repository:
    build:
      # context = repo root so the image installs neo4aas from the local checkout
      context: ../..
      dockerfile: deploy/docker/Dockerfile.repository
    ports:
      - "8084:80"
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "12345678"
      API_BASE_PATH: /api/v3.1/
      INPUT: /input
      # Max AAS files loaded per manufacturer subdirectory under /input.
      MAX_PER_DIR: "2000"
    volumes:
      - ../../data/real_aas/real_aas_combined:/input:ro
    # Loading up to 2000 AAS x 5 manufacturers happens once at worker boot, so allow a
    # long boot/request timeout instead of the demonstrator's default 120s.
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:80
      - --workers
      - "1"
      - --timeout
      - "1800"
      - --graceful-timeout
      - "1800"
      - neo4aas.basyx_ext.server.run_repository:application
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/api/v3.1/description')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 1800s

volumes:
  neo4j_data:
  neo4j_logs:
