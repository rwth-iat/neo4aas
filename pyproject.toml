[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aas4graph"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j",
    "basyx-python-sdk"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "jsonschema>=4.0",
    "testcontainers[neo4j]>=4.0",
]
mcp = [
    "mcp[cli]>=1.2",
    "pyyaml>=6.0",
]
chatbot_v2 = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "faiss-cpu>=1.8",
    "langfuse>=2.0",
    "flask>=3.0",
    "requests>=2.31",
]

[project.scripts]
aas4graph-mcp = "aas_mapping.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aas_mapping*"]

[tool.setuptools.package-data]
# chatbot_v2 serves its UI from the installed package (Flask static_folder="static"),
# so the assets must ship in the wheel — the image no longer COPYs them separately.
"aas_mapping.chatbot_v2" = ["static/*", "static/**/*"]
"aas_mapping.aas_neo4j_adapter.querification" = ["spec/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a live Neo4j instance",
]
