[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo4aas"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
# `neo4aas.core` maps AAS JSON/XML/AASX to Neo4j and compiles AASQL to Cypher using
# nothing but the driver. Everything that touches the basyx SDK lives in
# `neo4aas.basyx_ext` / `neo4aas.eclass`, so basyx is an extra, not a base dependency —
# `neo4aas[mcp]` and `neo4aas[chatbot]` install without it. Enforced by
# tests/test_layering.py.
dependencies = [
    "neo4j",
]

[project.optional-dependencies]
basyx = [
    "basyx-python-sdk",
]
server = [
    "neo4aas[basyx]",
    "gunicorn",
]
eclass = [
    "neo4aas[basyx]",
]
mcp = [
    "mcp[cli]>=1.2",
    "pyyaml>=6.0",
]
chatbot = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "faiss-cpu>=1.8",
    "langfuse>=2.0",
    "flask>=3.0",
    "requests>=2.31",
]
test = [
    "neo4aas[basyx]",
    "pytest>=7.0",
    "jsonschema>=4.0",
    "testcontainers[neo4j]>=4.0",
]

[project.scripts]
neo4aas-mcp = "neo4aas.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neo4aas*"]

[tool.setuptools.package-data]
# The chatbot serves its UI from the installed package (Flask static_folder="static"),
# so the assets must ship in the wheel — the image no longer COPYs them separately.
"neo4aas.chatbot" = ["static/*", "static/**/*"]
"neo4aas.core.query" = ["spec/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require a live Neo4j instance",
]
