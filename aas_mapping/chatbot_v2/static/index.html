<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AAS Assistant v2</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="logo">▣ AAS Assistant</span>
    <span class="sub">LangGraph · gpt-oss-120b · read-only</span>
    <span class="spacer"></span>
    <label class="repo-select" title="Choose which AAS repository to query">
      <span class="repo-label">Repo</span>
      <select id="repo"></select>
    </label>
    <span id="chatid" class="chatid" title="Copy this id and send it for debugging" hidden>
      <span class="chatid-label">chat</span>
      <code id="chatid-val"></code>
      <button id="chatid-copy" title="Copy chat id">⧉</button>
    </span>
    <button id="reset" title="New conversation">New chat</button>
    <img class="brand-logo" src="/static/img/rwth-iat-logo.png" alt="RWTH IAT" />
  </header>

  <main id="transcript" class="transcript">
    <div class="hint" id="hint"></div>
  </main>

  <form id="composer" class="composer">
    <textarea id="input" rows="1" placeholder="Ask about the AAS repository…"></textarea>
    <button id="send" type="submit">Send</button>
  </form>

  <script src="/static/app.js"></script>
</body>
</html>
